<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>og</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>html,body{margin:0;width:1200px;height:630px;overflow:hidden}
.og{display:grid;grid-template-columns:1fr 520px;gap:40px;align-items:center;padding:0 64px;height:630px;background:var(--mz-paper)}
.og h1{font-size:62px;max-width:12ch}.og p{margin-top:20px;font-size:26px;color:var(--mz-muted);max-width:24ch;line-height:1.35}
.og .mz-logo{font-size:30px;display:block;margin-bottom:28px}.og .mz-folha{transform:rotate(1.5deg)}</style></head>
<body class="mz"><div class="og"><div><a class="mz-logo">M<b>OOO</b>SE</a><h1>Corretor de redação do ENEM <span style="white-space:nowrap">open-source</span></h1><p>Traga sua IA. Corrija de graça.</p></div><figure class="mz-folha" aria-label="Exemplo de redação corrigida">
          <span class="mz-folha__tag">exemplo</span>
          <div class="mz-folha__head"><span>FOLHA DE REDAÇÃO</span><span>correção por competência</span></div>
          <div class="mz-folha__body">
            <ol>
              <li><span>1</span><span>A Constituição assegura a todos</span></li>
              <li><span>2</span><span>o direito à cultura, <span class="mz-hl">no entanto,</span></span></li>
              <li><span>3</span><span>povos tradicionais ainda enfrentam o</span></li>
              <li><span>4</span><span><span class="mz-under">preconceito</span> e o apagamento cultural.</span></li>
              <li><span>5</span><span>Nesse cenário, a escola é decisiva:</span></li>
              <li><span>6</span><span>é nela que a diversidade se conhece.</span></li>
              <li><span>7</span><span><span class="mz-hl">Dessarte,</span> cabe ao Ministério da</span></li>
              <li><span>8</span><span>Educação criar campanhas escolares,</span></li>
              <li><span>9</span><span>por meio de aulas e palestras, a fim</span></li>
              <li><span>10</span><span>de combater o estigma.</span></li>
            </ol>
            <div class="mz-folha__notes" aria-hidden="true">
              <div class="mz-note" style="top:0;animation-delay:.5s">repertório ✓ (C2)</div>
              <div class="mz-note" style="top:62px;animation-delay:.85s">troque o conectivo (C4)</div>
              <div class="mz-note" style="top:130px;animation-delay:1.2s">tese clara ✓ (C3)</div>
              <div class="mz-note" style="top:226px;animation-delay:1.55s">detalhe meio e finalidade (C5)</div>
            </div>
          </div>
          <div class="mz-folha__score">
            <div>C1<b>160</b></div><div>C2<b>160</b></div><div>C3<b>120</b></div><div>C4<b>120</b></div><div>C5<b>160</b></div>
            <div class="mz-total">nota<b>720</b></div>
          </div>
        </figure></div></body></html>
